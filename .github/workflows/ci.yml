name: Rust backend
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_PROFILE_TEST_INCREMENTAL: "false"
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust
        run: rustup show
      - name: Install pinned contract validator
        run: |
          python3 -m venv work/contracts-venv
          work/contracts-venv/bin/python -m pip install -r api/requirements-contracts.txt
          echo "$PWD/work/contracts-venv/bin" >> "$GITHUB_PATH"
      - name: Check workspace
        run: bash scripts/check.sh
      - name: Verify checks reject formatting and assertion failures
        run: python3 scripts/test_ci.py
      - name: Build and smoke-test host executable
        run: |
          cargo build --locked -p atmusic-server
          python3 scripts/smoke.py target/debug/atmusic
          python3 scripts/test_smoke.py
  static-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install musl build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install pinned Rust
        run: rustup show
      - name: Build static executable
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p atmusic-server
      - name: Verify static packaging and HTTP
        run: |
          binary=target/x86_64-unknown-linux-musl/release/atmusic
          python3 scripts/smoke.py --static "$binary"
          (cd "$(dirname "$binary")" && sha256sum atmusic > atmusic.sha256)
          python3 scripts/test_release.py "$binary"
          python3 scripts/package_release.py "$binary" --tag "v$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')" --output work/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atmusic-linux-x86_64-musl
          path: |
            target/x86_64-unknown-linux-musl/release/atmusic
            target/x86_64-unknown-linux-musl/release/atmusic.sha256
            work/release/*.tar.gz
            work/release/SHA256SUMS
