# Deploy the atmusic Worker (ADR 0004 §4.2, §9.2 A1/A19, §15 Q3/Q4; W6-04).
#
# Manual dispatch only. The job runs in the GitHub environment named by the
# `environment` input (production, staging or free); protect each one with
# required reviewers and give it the CLOUDFLARE_API_TOKEN secret (a token
# scoped to Workers Scripts:Edit on the owner's account) and the
# CLOUDFLARE_ACCOUNT_ID variable. The Worker's own secrets (CURSOR_KEY,
# optional ADMIN_TOKEN) are set once with `wrangler secret put`, never here.
#
# Steps: npm ci → check-ts.sh → preflight (owned prefix, CURSOR_KEY present) →
# gen-config → vite build → bundle guard (wrangler deploy --dry-run, bundle
# SHA-256) → wrangler versions upload (version id) → wrangler versions deploy
# <id>@100% → smoke test. `initial: true` replaces upload+deploy with
# `wrangler deploy`, which is required while a Durable Object migration (the
# first deploy's v1 IndexDO class) is pending. scripts/deploy.sh runs the same
# steps locally.
name: Deploy Worker
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Wrangler environment to deploy'
        type: choice
        required: true
        default: production
        options:
          - production
          - staging
          - free
      initial:
        description: 'First deploy of this environment (applies the IndexDO migration with wrangler deploy)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
    timeout-minutes: 60
    env:
      ATMUSIC_ENV: ${{ inputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Node (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned contract validator
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r api/requirements-contracts.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned actionlint (checked by the TypeScript gate)
        run: |
          # go install verifies the module against sum.golang.org.
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: TypeScript gate
        run: bash scripts/check-ts.sh
      - name: Preflight (owned prefix and origin, CURSOR_KEY secret present)
        run: bash scripts/deploy.sh --env "$ATMUSIC_ENV" --preflight
      - name: Generate client metadata and _headers
        run: npx tsx scripts/gen-config.ts --env "$ATMUSIC_ENV"
      - name: Build the SPA (vite build)
        run: npm run build:web
      - name: Bundle guard and bundle SHA-256
        id: bundle
        run: |
          set -o pipefail
          npx tsx scripts/check-bundle.ts --env "$ATMUSIC_ENV" --release | tee "$RUNNER_TEMP/check-bundle.out"
          sha="$(sed -n 's/^check-bundle: bundle sha256 \([0-9a-f]\{64\}\)$/\1/p' "$RUNNER_TEMP/check-bundle.out" | tail -n 1)"
          test -n "$sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Upload Worker version
        id: upload
        if: ${{ !inputs.initial }}
        env:
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          env_args=()
          if [ "$ATMUSIC_ENV" != production ]; then env_args=(--env "$ATMUSIC_ENV"); fi
          out="$RUNNER_TEMP/wrangler-upload.ndjson"
          WRANGLER_OUTPUT_FILE_PATH="$out" npx wrangler versions upload --config worker/wrangler.jsonc \
            "${env_args[@]}" --message "atmusic $GITHUB_SHA bundle sha256 $BUNDLE_SHA256"
          id="$(node -e 'const l=require("node:fs").readFileSync(process.argv[1],"utf8").split("\n").filter(Boolean).map((x)=>JSON.parse(x)).filter((e)=>e.type==="version-upload"&&typeof e.version_id==="string");if(!l.length)process.exit(1);console.log(l[l.length-1].version_id)' "$out")"
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
      - name: Deploy the version to 100%
        if: ${{ !inputs.initial }}
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          env_args=()
          if [ "$ATMUSIC_ENV" != production ]; then env_args=(--env "$ATMUSIC_ENV"); fi
          npx wrangler versions deploy "$VERSION_ID@100%" --yes --config worker/wrangler.jsonc \
            "${env_args[@]}" --message "atmusic $GITHUB_SHA bundle sha256 $BUNDLE_SHA256"
      - name: Initial deploy (applies Durable Object migrations)
        id: initial
        if: ${{ inputs.initial }}
        env:
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          env_args=()
          if [ "$ATMUSIC_ENV" != production ]; then env_args=(--env "$ATMUSIC_ENV"); fi
          out="$RUNNER_TEMP/wrangler-deploy.ndjson"
          WRANGLER_OUTPUT_FILE_PATH="$out" npx wrangler deploy --config worker/wrangler.jsonc \
            "${env_args[@]}" --message "atmusic $GITHUB_SHA bundle sha256 $BUNDLE_SHA256"
          id="$(node -e 'const l=require("node:fs").readFileSync(process.argv[1],"utf8").split("\n").filter(Boolean).map((x)=>JSON.parse(x)).filter((e)=>e.type==="deploy"&&typeof e.version_id==="string");if(!l.length)process.exit(1);console.log(l[l.length-1].version_id)' "$out")"
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
      - name: Smoke test /health/live, /health/ready and /api/v1/meta
        run: bash scripts/deploy.sh --env "$ATMUSIC_ENV" --smoke-only
      - name: Record release evidence
        if: ${{ always() && steps.bundle.outputs.sha256 != '' }}
        env:
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          VERSION_ID: ${{ steps.upload.outputs.version_id || steps.initial.outputs.version_id }}
        run: |
          {
            echo "### atmusic deploy ($ATMUSIC_ENV)"
            echo ""
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- Worker version id: \`${VERSION_ID:-none}\`"
            echo "- bundle SHA-256: \`$BUNDLE_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
