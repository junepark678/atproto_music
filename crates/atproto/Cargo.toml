[package]
name = "atmusic-atproto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
reqwest.workspace = true
atmusic-storage.workspace = true
atmusic-core.workspace = true
oauth2 = { version = "=5.0.0", default-features = false }
jwt-compact = { version = "=0.8.0", default-features = false, features = ["std", "p256", "k256"] }
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8", "pem"] }
rand = "=0.8.6"
base64 = "=0.22.1"
sha2 = "=0.10.9"
aes-gcm = "=0.10.3"
getrandom = "=0.3.4"
hkdf = "=0.12.4"
ciborium = "=0.2.2"
ipld-core = { version = "=0.4.2", features = ["serde"] }
chrono = { version = "=0.4.42", default-features = false, features = ["std", "serde"] }
atrium-repo = "=0.1.8"
atrium-crypto = "=0.1.3"
atrium-api = "=0.25.8"
serde_ipld_dagcbor = "=0.6.4"
unsigned-varint = "=0.8.0"
futures = "=0.3.31"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url = { version = "=2.5.7", features = ["serde"] }
hickory-resolver = "=0.26.3"
async-trait = "=0.1.89"
thiserror = "=2.0.17"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
axum.workspace = true
tempfile = "=3.23.0"
sqlx.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }

[lints]
workspace = true
