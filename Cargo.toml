[workspace]
members = ["crates/core", "crates/storage", "crates/atproto", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/junepark678/atproto_music"

[workspace.dependencies]
atmusic-core = { path = "crates/core" }
atmusic-storage = { path = "crates/storage" }
atmusic-atproto = { path = "crates/atproto" }
axum = { version = "=0.8.6", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "=4.5.48", features = ["derive", "env"] }
http-body-util = "=0.1.3"
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "=0.5.2", features = ["util"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "=1.18.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
