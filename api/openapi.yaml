      "Operation": {
        "type": "object",
        "additionalProperties": false,
        "description": "One server outbox operation (ADR 0005 §5.8). Visible to its owner only.",
        "required": [
          "id",
          "kind",
          "origin",
          "state",
          "attempts",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/OperationId"
          },
          "kind": {
            "enum": [
              "scrobble.create",
              "scrobble.delete",
              "follow.put",
              "follow.delete",
              "settings.put",
              "love.put",
              "love.delete"
            ]
          },
          "origin": {
            "enum": [
              "web",
              "lastfm",
              "listenbrainz",
              "import"
            ]
          },
          "state": {
            "enum": [
              "queued",
              "running",
              "succeeded",
              "failed",
              "blocked",
              "cancelled"
            ]
          },
          "attempts": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10
          },
          "uri": {
            "$ref": "#/components/schemas/AtUri"
          },
          "cid": {
            "$ref": "#/components/schemas/Cid"
          },
          "error": {
            "type": "string",
            "pattern": "^[a-z0-9_]{1,64}$",
            "description": "Sanitized failure code."
          },
          "createdAt": {
            "$ref": "#/components/schemas/Timestamp"
          },
          "updatedAt": {
            "$ref": "#/components/schemas/Timestamp"
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "state": {
                  "const": "failed"
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "required": [
                "error"
              ]
            }
          },
          {
            "if": {
              "properties": {
                "state": {
                  "enum": [
                    "queued",
                    "running",
                    "cancelled"
                  ]
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "not": {
                "required": [
                  "error"
                ]
              }
            }
          }
        ]
      },
      "Accepted": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "operation"
