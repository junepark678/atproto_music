            "type": "string",
            "minLength": 1
          },
          "indexing": {
            "$ref": "#/components/schemas/Indexing"
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "state": {
                  "const": "indexed"
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "required": [
                "cid",
                "revision"
              ]
            }
          },
          {
            "if": {
              "properties": {
                "state": {
                  "const": "excluded"
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "required": [
                "reason"
              ]
            },
            "else": {
              "not": {
                "required": [
                  "reason"
                ]
              }
            }
          },
          {
            "if": {
              "properties": {
                "state": {
                  "const": "unknown"
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "not": {
                "anyOf": [
                  {
                    "required": [
                      "cid"
                    ]
                  },
                  {
                    "required": [
                      "revision"
                    ]
                  }
                ]
              }
            }
          }
        ]
      },
