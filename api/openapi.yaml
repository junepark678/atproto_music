{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "AT Protocol Music API",
    "version": "1.2.0",
    "description": "API contract v1.2 from docs/planning/API.md as amended by ADR 0004 §9 (docs/adr/0004-cloudflare-workers.md) and ADR 0005 B14 (docs/adr/0005-local-node-host-and-compat-apis.md §5.7, §16). A route in this specification is not a claim that the current executable implements it. Every v1.1 route and payload is unchanged except the additive optional Scrobble fields (ADR 0005 §6.2); no v1.1 read route reads a session, cookie, CSRF token or Origin header. v1.2 adds the confidential OAuth client (BFF) routes: sign-in, cookie sessions (__Host-atmusic_session) with CSRF (Origin plus X-CSRF-Token) on every unsafe cookie route, server writes into one outbox (202 Accepted with an Operation), the account, credential, link and import routes, and the dynamic /oauth/client-metadata.json and /oauth/jwks.json. The Last.fm 2.0 API (/2.0/) and the ListenBrainz API (/1/) are specified in ADR 0005 §7 and §8 and docs/compat/{lastfm,listenbrainz}.md, not here. Schema and transport fixtures use reserved identities and a fixture-only namespace; production publication requires an owner-controlled prefix. All application JSON objects are closed; absent optional fields are omitted, not null/empty. No response returns upstream access/refresh tokens, DPoP keys or private signing keys; the server holds them sealed at rest (ADR 0005 §5.5)."
  },
  "servers": [
    {
      "url": "/",
      "description": "Configured application origin (ATMUSIC_PUBLIC_ORIGIN); the OAuth client metadata, its client_id and every expected Origin derive from it, never from Host or X-Forwarded-* headers."
    }
  ],
