      "OAuthBindingCookie": {
        "name": "__Host-atmusic_oauth",
        "in": "cookie",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^[0-9a-f]{64}$"
        },
        "description": "The login-CSRF cookie set by POST /api/v1/auth/start; its SHA-256 must equal the state binding (ADR 0005 §5.6). Missing or mismatched is 403 oauth_binding_mismatch."
      },
      "UploadSource": {
        "name": "source",
        "in": "query",
