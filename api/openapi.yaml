  "info": {
    "title": "AT Protocol Music API",
    "version": "1.1.0",
    "description": "API contract v1.1 from docs/planning/API.md as amended by ADR 0004 §9 (docs/adr/0004-cloudflare-workers.md). A route in this specification is not a claim that the current executable implements it. The Worker is a read-only AppView: every route is public, and there is no session, cookie, CSRF token or server write route. The browser SPA is the atproto OAuth client and writes to the user's own PDS (A2, A3). Schema and transport fixtures use reserved identities and a fixture-only namespace; production publication requires an owner-controlled prefix. All application JSON objects are closed; absent optional fields are omitted, not null/empty. No upstream access/refresh tokens or private signing keys are returned or held by the server."
  },
  "servers": [
    {
      "url": "/",
      "description": "Configured application origin (PUBLIC_ORIGIN); OAuth client metadata is generated from it at build time, never from Host headers."
    }
  ],
