        "type": "object",
        "additionalProperties": false,
        "required": [
          "uri",
          "state",
          "indexing"
        ],
        "description": "Indexing state of one record (N2). indexed: a visible row with its verified cid and revision. pending: a hint or job exists. absent: verified absence. excluded: a verified record failed validation, with reason. unknown: nothing is known.",
        "properties": {
          "uri": {
            "$ref": "#/components/schemas/AtUri"
          },
          "state": {
            "enum": [
              "indexed",
              "pending",
              "absent",
              "excluded",
              "unknown"
            ]
          },
          "cid": {
            "$ref": "#/components/schemas/Cid"
          },
          "revision": {
            "type": "string",
