      "ConfidentialClientMetadata": {
        "type": "object",
        "additionalProperties": false,
        "description": "The dynamic confidential-client metadata document of ADR 0005 §5.3, served exactly, with Cache-Control public, max-age=300 and no cookie. client_id, client_uri, redirect_uris and jwks_uri derive from ATMUSIC_PUBLIC_ORIGIN only.",
        "required": [
          "client_id",
          "client_name",
          "client_uri",
          "application_type",
          "redirect_uris",
          "grant_types",
          "response_types",
          "scope",
          "token_endpoint_auth_method",
          "token_endpoint_auth_signing_alg",
          "jwks_uri",
          "dpop_bound_access_tokens"
        ],
        "properties": {
          "client_id": {
            "type": "string",
            "format": "uri",
            "pattern": "^https://[^/?#]+/oauth/client-metadata\\.json$"
          },
          "client_name": {
            "const": "AT Protocol Music"
          },
          "client_uri": {
            "type": "string",
            "format": "uri",
            "pattern": "^https://[^/?#]+$"
          },
          "application_type": {
            "const": "web"
          },
          "redirect_uris": {
            "type": "array",
            "minItems": 1,
            "maxItems": 1,
            "items": {
              "type": "string",
              "format": "uri",
              "pattern": "^https://[^/?#]+/oauth/callback$"
            }
          },
          "grant_types": {
            "const": [
              "authorization_code",
              "refresh_token"
            ]
          },
          "response_types": {
            "const": [
              "code"
            ]
          },
          "scope": {
            "type": "string",
            "pattern": "^atproto repo:([A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)+)\\.scrobble repo:\\1\\.follow repo:\\1\\.settings repo:\\1\\.love( transition:generic)?$",
            "description": "atproto plus repo:<p>.scrobble, repo:<p>.follow, repo:<p>.settings and repo:<p>.love; transition:generic only when ATMUSIC_OAUTH_TRANSITION_GENERIC=1 (ADR 0004 Q5)."
          },
          "token_endpoint_auth_method": {
            "const": "private_key_jwt"
          },
          "token_endpoint_auth_signing_alg": {
            "const": "ES256"
          },
          "jwks_uri": {
            "type": "string",
            "format": "uri",
            "pattern": "^https://[^/?#]+/oauth/jwks\\.json$"
          },
          "dpop_bound_access_tokens": {
            "const": true
          }
        }
      },
      "Jwk": {
        "type": "object",
        "additionalProperties": false,
        "description": "A public ES256 signing key. The private member d (and any other member) is never published.",
        "required": [
