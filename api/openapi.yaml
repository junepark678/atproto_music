    "parameters": {
      "DidPath": {
        "name": "did",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/Did"
        }
      },
      "ScrobbleIdPath": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/AtUri"
        },
        "description": "URL-encoded full AT URI; not a bare record key or operation ID."
      },
      "ListLimit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        },
        "description": "Noninteger, zero, negative or over maximum returns 422 with error.fields; never clamp."
      },
      "TopLimit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 10
        },
        "description": "Maximum entries per statistics ranking. Invalid values: 422 with error.fields."
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "schema": {
          "type": "string"
        },
        "description": "Opaque signed cursor bound to query, scope and viewer. Malformed/tampered/wrong-query cursors: 400 invalid_cursor. First-page upper ordering boundary and last-seen (listenedAt, AT URI) tuple give stable traversal over current state; updates/deletions remain visible and records are not frozen snapshots."
      },
      "HandleQuery": {
        "name": "handle",
        "in": "query",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/Handle"
        }
      },
      "Scope": {
        "name": "scope",
        "in": "query",
        "schema": {
          "enum": [
            "global",
            "following"
          ],
          "default": "global"
        },
        "description": "following requires viewer=<did> (422 fields.viewer otherwise); excludes implicit self. global is public."
      },
      "Window": {
        "name": "window",
        "in": "query",
        "schema": {
          "enum": [
            "all",
            "7d",
            "30d",
            "365d"
          ],
          "default": "all"
        }
      },
      "Viewer": {
        "name": "viewer",
        "in": "query",
        "schema": {
          "$ref": "#/components/schemas/Did"
        },
        "x-required-when": {
          "scope": "following"
        },
        "description": "DID whose music follows define scope=following (A8). Required for following; missing or invalid is 422 fields.viewer, and the following cursor binds the viewer. For scope=global the viewer does not filter and is not bound into the cursor: the global binding carries viewer=null (crates/core/src/cursor.rs global_feed), so a global cursor is the same token with or without a viewer, and a global binding that carries a viewer is 400 invalid_cursor. A supplied viewer that is not a valid DID is still 422 fields.viewer because the parameter schema is Did. The viewer is public input, not authentication."
      },
      "RecordUriQuery": {
        "name": "uri",
        "in": "query",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/AtUri"
        },
        "description": "Full AT URI of a record in a configured collection; invalid is 422 fields.uri."
      },
      "Origin": {
        "name": "Origin",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uri"
        },
        "description": "Exactly one Origin header equal to ATMUSIC_PUBLIC_ORIGIN; missing, duplicate or foreign is 403 csrf_failed (ADR 0005 §5.6)."
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/IdempotencyKey"
        },
        "description": "Missing is 400 idempotency_key_required; malformed is 400 invalid_idempotency_key. The same key and request hash return the same operation; the same key with a different hash is 409 idempotency_conflict."
      },
      "OperationIdPath": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/OperationId"
        }
      },
      "CredentialIdPath": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/CredentialId"
        }
      },
      "LastfmApiKeyPath": {
        "name": "apiKey",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/LastfmApiKey"
        }
      },
      "LoveArtistQuery": {
        "name": "artist",
        "in": "query",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/MusicText"
        }
      },
      "LoveTrackQuery": {
        "name": "track",
        "in": "query",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/MusicText"
        }
      },
      "OAuthState": {
        "name": "state",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "maxLength": 512
        }
      },
      "OAuthCode": {
        "name": "code",
