    "/api/v1/auth/callback": {
      "get": {
        "operationId": "auth_callback",
        "summary": "Auth callback",
        "security": [],
        "responses": {
          "303": {
            "description": "Redirect to configured application origin /feed after issuing Secure HttpOnly SameSite=Lax session cookie.",
            "headers": {
              "Location": {
                "required": true,
                "schema": {
                  "type": "string",
                  "format": "uri",
                  "pattern": "^https://[^/?#]+/feed$"
                }
              },
              "Set-Cookie": {
                "required": true,
                "schema": {
                  "type": "string"
                },
                "description": "Seven-day absolute session lifetime; no upstream tokens."
              }
            }
          },
          "400": {
            "description": "Malformed JSON, cursor, or request header.",
