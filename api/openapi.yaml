                "cid",
                "revision"
              ]
            }
          },
          {
            "if": {
              "properties": {
                "state": {
                  "const": "excluded"
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "required": [
                "reason"
              ]
            },
            "else": {
              "not": {
                "required": [
                  "reason"
                ]
              }
            }
          },
          {
            "if": {
              "properties": {
                "state": {
                  "const": "unknown"
                }
              },
              "required": [
                "state"
              ]
            },
            "then": {
              "not": {
                "anyOf": [
                  {
                    "required": [
                      "cid"
                    ]
                  },
                  {
                    "required": [
                      "revision"
                    ]
                  }
                ]
              }
            }
          }
        ]
