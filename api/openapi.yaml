    "parameters": {
      "DidPath": {
        "name": "did",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/Did"
        }
      },
      "ScrobbleIdPath": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/AtUri"
        },
        "description": "URL-encoded full AT URI; not a bare record key or operation ID."
      },
      "OperationIdPath": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string"
        },
        "description": "Opaque local operation identifier, distinct from an AT URI."
      },
      "Origin": {
        "name": "Origin",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uri"
        },
        "description": "Must equal the configured allowed application origin. Missing or invalid Origin is 403 before mutation or any outbound write."
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^[ -~]+$",
          "not": {
            "pattern": "[^ -~]"
          }
        },
        "description": "1–128 printable ASCII characters. Invalid/missing header: 400 invalid_idempotency_key. Owner-scoped digest/key retained until local-data disconnect; changed canonical input: 409 idempotency_conflict; replay returns the current valid original result. Explicit amendment: replay of a terminal failed original operation, or succeeded original with no currently public record, returns 409 idempotency_result_unavailable; original operation remains in its real terminal state."
      },
      "ListLimit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        },
        "description": "Noninteger, zero, negative or over maximum returns 422 with error.fields; never clamp."
      },
      "TopLimit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 10
        },
        "description": "Maximum entries per statistics ranking. Invalid values: 422 with error.fields."
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "schema": {
          "type": "string"
        },
        "description": "Opaque signed cursor bound to query, scope and viewer. Malformed/tampered/wrong-query cursors: 400 invalid_cursor. First-page upper ordering boundary and last-seen (listenedAt, AT URI) tuple give stable traversal over current state; updates/deletions remain visible and records are not frozen snapshots."
      },
      "HandleQuery": {
        "name": "handle",
        "in": "query",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/Handle"
        }
      },
      "Scope": {
        "name": "scope",
        "in": "query",
        "schema": {
          "enum": [
            "global",
            "following"
          ],
          "default": "global"
        },
        "description": "following requires a valid session (401 otherwise); excludes implicit self. global is public."
      },
      "Window": {
        "name": "window",
        "in": "query",
        "schema": {
          "enum": [
            "all",
            "7d",
            "30d",
            "365d"
          ],
          "default": "all"
        }
      },
      "OAuthState": {
        "name": "state",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1
        },
        "description": "Original random single-use state. Eligible before 300 seconds and invalid at exactly 300 seconds; validation precedes token redemption."
      },
      "OAuthCode": {
        "name": "code",
        "in": "query",
        "schema": {
          "type": "string",
          "minLength": 1
        },
        "description": "Required for successful authorization; alternatively error indicates cancellation/failure."
      },
      "OAuthIssuer": {
        "name": "iss",
        "in": "query",
        "schema": {
          "type": "string",
          "format": "uri"
        },
        "description": "Authorization issuer; verify against the issuer persisted for this state according to the pinned OAuth profile.",
        "required": true
      },
      "OAuthError": {
        "name": "error",
        "in": "query",
        "schema": {
          "type": "string"
